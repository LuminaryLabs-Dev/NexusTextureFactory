name: Deploy Spinosaurus to GitHub Pages

on:
  push:
    branches: ["build"]
    paths:
      - "NexusTextureFactory-Spinosaurus/**"
      - ".github/workflows/pages-spinosaurus.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "NexusTextureFactory-Spinosaurus/package-lock.json"

      - name: Install
        working-directory: NexusTextureFactory-Spinosaurus
        run: npm ci

      - name: Build
        working-directory: NexusTextureFactory-Spinosaurus
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: NexusTextureFactory-Spinosaurus/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
